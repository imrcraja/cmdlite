name: Build CmdLite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"

      - name: Find and build Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find . -name "build.gradle" -type f -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi

          echo "Gradle project found at: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "Building CmdLite..."
          gradle build --no-daemon

      - name: Find JAR
        shell: bash
        run: |
          echo "Built JAR files:"
          find . -path "*/build/libs/*.jar" -type f -print

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CmdLite-JAR
          path: "**/build/libs/*.jar"
          if-no-files-found: error
