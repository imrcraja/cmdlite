name: Build CmdLite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Find and build Gradle project
        shell: bash
        run: |
          set -euo pipefail

          project_dir="$(find . -name build.gradle -not -path '*/build/*' -print -quit)"
          if [[ -z "$project_dir" ]]; then
            echo "::error::No build.gradle file found."
            exit 1
          fi

          project_dir="$(dirname "$project_dir")"
          echo "Building Gradle project in: $project_dir"
          gradle --no-daemon --stacktrace -p "$project_dir" build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cmdlite-fabric-26.1.2
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
          if-no-files-found: error
